name: Conferir estoque de posts

on:
  schedule:
    - cron: '0 12 * * *' # 09:00 em Fortaleza
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estoque:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node src/cli/estoque.js
