name: Postar carrossel do dia

on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 18:00 em Fortaleza
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (AAAA-MM-DD); vazio = hoje em Fortaleza'
        required: false
      simular:
        description: 'Simular: gera as imagens e confere tudo, sem publicar'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  # 1) Valida o post do dia e gera os 4 JPEGs (e, em simulação, confere a conta do Instagram).
  preparar:
    runs-on: ubuntu-latest
    outputs:
      pular: ${{ steps.preparar.outputs.pular }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Preparar imagens do dia
        id: preparar
        run: node src/cli/preparar.js ${{ github.event_name == 'workflow_dispatch' && inputs.data || '' }}

      - name: Simulação (não publica nada)
        if: steps.preparar.outputs.pular == 'false' && github.event_name == 'workflow_dispatch' && inputs.simular
        env:
          SIMULAR: 'true'
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node src/cli/publicar.js
      - name: Guardar imagens da simulação
        if: steps.preparar.outputs.pular == 'false' && github.event_name == 'workflow_dispatch' && inputs.simular
        uses: actions/upload-artifact@v4
        with:
          name: imagens-simulacao
          path: site

      - name: Empacotar imagens para o GitHub Pages
        if: steps.preparar.outputs.pular == 'false' && (github.event_name != 'workflow_dispatch' || !inputs.simular)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Guardar o contexto do dia
        if: steps.preparar.outputs.pular == 'false' && (github.event_name != 'workflow_dispatch' || !inputs.simular)
        uses: actions/upload-artifact@v4
        with:
          name: contexto
          path: tmp/contexto.json

  # 2) Coloca as imagens no ar (o Instagram baixa por um link público).
  deploy:
    needs: preparar
    if: needs.preparar.outputs.pular == 'false' && (github.event_name != 'workflow_dispatch' || !inputs.simular)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # 3) Publica o carrossel no Instagram e registra o dia.
  publicar:
    needs: [preparar, deploy]
    if: needs.preparar.outputs.pular == 'false' && (github.event_name != 'workflow_dispatch' || !inputs.simular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: contexto
          path: tmp

      - name: Publicar no Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node src/cli/publicar.js

      - name: Guardar registro
        run: |
          git config user.name "omega-bot"
          git config user.email "omega-bot@users.noreply.github.com"
          git add registro/publicados.json
          git commit -m "registro: publicado em $(date -u +%F)" || exit 0
          git push
