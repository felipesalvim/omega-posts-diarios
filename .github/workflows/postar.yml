name: Postar carrossel do dia

on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 18:00 em Fortaleza
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do post (AAAA-MM-DD); vazio = hoje em Fortaleza'
        required: false
      simular:
        description: 'Simular: gera as imagens e confere tudo, sem publicar'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Preparar imagens do dia
        id: preparar
        run: node src/cli/preparar.js ${{ github.event_name == 'workflow_dispatch' && inputs.data || '' }}

      - name: Publicar imagens no GitHub Pages
        if: steps.preparar.outputs.pular == 'false' && env.SIMULAR != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy do Pages
        id: pages
        if: steps.preparar.outputs.pular == 'false' && env.SIMULAR != 'true'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        if: steps.preparar.outputs.pular == 'false'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node src/cli/publicar.js

      - name: Guardar registro
        if: steps.preparar.outputs.pular == 'false' && env.SIMULAR != 'true'
        run: |
          git config user.name "omega-bot"
          git config user.email "omega-bot@users.noreply.github.com"
          git add registro/publicados.json
          git commit -m "registro: publicado em $(date -u +%F)" || exit 0
          git push

      - name: Guardar imagens da simulação
        if: steps.preparar.outputs.pular == 'false' && env.SIMULAR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imagens-simulacao
          path: site
