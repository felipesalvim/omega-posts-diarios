name: Renovar token do Instagram

on:
  schedule:
    - cron: '0 12 1 * *' # dia 1 de cada mês
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Renovar e guardar o novo token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SEGREDOS_PAT }}
        run: |
          NOVO=$(node src/cli/renovar-token.js)
          echo "::add-mask::$NOVO"
          gh secret set IG_ACCESS_TOKEN --body "$NOVO" --repo "$GITHUB_REPOSITORY"
