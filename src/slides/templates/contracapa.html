<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>{{estilo}}</style></head>
<body>
<main class="slide contracapa {{fundo}}">
  <div class="andar"><div class="painel"><span>{{indice}}</span>{{seta}}</div><span class="etiqueta">{{etiqueta}}</span></div>
  <div class="area-texto"><h2 class="texto" data-max="92" data-min="44">{{texto}}</h2></div>
  <dl class="contatos">
    <div class="contato"><dt>WhatsApp</dt><dd>{{whatsapp}}</dd></div>
    <div class="contato"><dt>Instagram</dt><dd>{{instagram}}</dd></div>
    <div class="contato"><dt>Site</dt><dd>{{site}}</dd></div>
  </dl>
  <img class="logo" src="{{assets}}/{{logo}}" alt="Ômega Elevadores">
</main>
<script>{{ajuste}}</script>
</body></html>
