<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>{{estilo}}</style></head>
<body>

  <div class="fresta"></div>
  <header class="topo"><span class="marca"></span><span class="etiqueta">{{etiqueta}}</span></header>

<script>{{ajuste}}</script>
</body></html>
